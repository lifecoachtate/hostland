<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Started</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background-color: hsl(0, 0%, 4%);
            color: hsl(0, 0%, 100%);
            min-height: 100vh;
        }

        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 1rem;
            position: relative;
        }

        .grid-background {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(to right, hsl(0, 0%, 20%) 1px, transparent 1px),
                linear-gradient(to bottom, hsl(0, 0%, 20%) 1px, transparent 1px);
            background-size: 4rem 4rem;
            opacity: 0.2;
        }

        .content {
            position: relative;
            max-width: 28rem;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .dots {
            display: flex;
            justify-content: center;
            gap: 0.375rem;
            margin-bottom: 1.5rem;
        }

        .dot {
            width: 0.5rem;
            height: 0.5rem;
            border-radius: 9999px;
        }

        .dot-active {
            background-color: hsl(217, 91%, 60%);
        }

        .dot-semi {
            background-color: hsla(217, 91%, 60%, 0.5);
        }

        .dot-inactive {
            background-color: hsl(0, 0%, 15%);
        }

        .timer-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }

        .timer-glow {
            position: relative;
        }

        .timer-glow::before {
            content: '';
            position: absolute;
            inset: 0;
            background-color: hsla(217, 91%, 60%, 0.2);
            filter: blur(2.5rem);
            border-radius: 9999px;
        }

        .timer-card {
            position: relative;
            background-color: hsla(0, 0%, 7%, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid hsla(217, 91%, 60%, 0.3);
            border-radius: 0.5rem;
            padding: 0.75rem 1.5rem;
            width: 16rem;
        }

        .timer-display {
            text-align: center;
        }

        .timer-time {
            font-size: 2.5rem;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            color: hsl(217, 91%, 60%);
        }

        .timer-label {
            font-size: 0.625rem;
            color: hsl(0, 0%, 60%);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-top: 0.25rem;
        }

        .country-section {
            margin-top: 1rem;
        }

        .country-title {
            text-align: center;
            font-size: 0.875rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .country-button {
            width: 100%;
            height: 5rem;
            background-color: transparent;
            border: 2px solid hsla(217, 91%, 60%, 0.3);
            border-radius: 0.5rem;
            color: hsl(0, 0%, 100%);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .country-button:hover {
            border-color: hsl(217, 91%, 60%);
            background-color: hsla(217, 91%, 60%, 0.05);
        }

        @media (max-width: 768px) {
            .timer-card {
                width: 8rem;
                padding: 0.5rem 1rem;
            }

            .timer-time {
                font-size: 1.5rem;
            }

            .timer-label {
                font-size: 0.5625rem;
            }

            .country-button {
                height: 4rem;
                font-size: 0.875rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="grid-background"></div>
        
        <div class="content">
            <div class="header">
                <div class="dots">
                    <div class="dot dot-active"></div>
                    <div class="dot dot-semi"></div>
                    <div class="dot dot-inactive"></div>
                </div>

                <div class="timer-wrapper">
                    <div class="timer-glow">
                        <div class="timer-card">
                            <div class="timer-display">
                                <div class="timer-time" id="timer">03:52</div>
                                <div class="timer-label">Time Remaining</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="country-section">
                <h2 class="country-title">COUNTRY</h2>
                
                <div class="button-group">
                    <button class="country-button" onclick="startNow()">
                        United States
                    </button>
                    <button class="country-button" onclick="startNow()">
                        Canada
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let timeLeft = 232; // 3:52 in seconds
        const timerElement = document.getElementById('timer');

        function updateTimer() {
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                return;
            }

            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            const formattedTime = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            
            timerElement.textContent = formattedTime;
            timeLeft--;
        }

        const timerInterval = setInterval(updateTimer, 1000);

        function startNow() {
            // Change this URL to your actual start page
            window.location.href = '/start';
        }
    </script>
</body>
</html>
